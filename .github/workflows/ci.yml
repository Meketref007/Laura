name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir --no-binary annoy -e ".[dev]" pytest-xdist pytest-cov mypy types-requests types-PyYAML types-setuptools

      - name: Lint with ruff
        run: ruff check shopee_agent/ --line-length=120

      - name: Test with pytest
        run: python -m pytest tests/ -q --tb=short --ignore=tests/_archive -k "not test_memory_summary_command" -m "not integration" --junitxml=junit.xml -o junit_family=legacy --cov=shopee_agent --cov-report=xml --cov-report=term-missing --cov-fail-under=38

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ matrix.python-version }}
          path: junit.xml

      - name: Upload coverage to summary
        if: always()
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          badge: true
          format: markdown
          output: both

  mypy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" mypy types-requests types-PyYAML types-setuptools

      - name: Run mypy
        run: mypy shopee_agent/paths.py shopee_agent/config.py shopee_agent/logger.py shopee_agent/retry.py shopee_agent/rate_limit.py shopee_agent/structured_logger.py shopee_agent/tracing.py shopee_agent/event_bus.py shopee_agent/api_cache.py shopee_agent/auth.py shopee_agent/graceful_shutdown.py shopee_agent/plugin_sdk.py shopee_agent/api_router.py --ignore-missing-imports --follow-imports=skip --no-error-summary

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir --no-binary annoy -e ".[dev]"
      - name: Test with pytest (integration)
        run: python -m pytest tests/integration -m integration -q --tb=short --junitxml=junit-integration.xml -o junit_family=legacy
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-integration
          path: junit-integration.xml

  pester:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -Force -Scope CurrentUser -SkipPublisherCheck
      - name: Run Pester (scripts PowerShell)
        shell: pwsh
        run: Invoke-Pester -Path .\tests\pester -Output Detailed -PassThru
        env:
          CI: "true"

  build-setup:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pillow (icone do Setup)
        run: python -m pip install pillow
      - name: Build Setup.exe
        shell: pwsh
        run: .\installer\build_setup.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: laura-setup
          path: dist\Laura-Setup-*.exe
          if-no-files-found: error

  install-e2e:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalacao real ponta a ponta (venv + deps + .env + servicos)
        shell: pwsh
        env:
          LAURA_HOME: ${{ runner.temp }}\LauraE2E\code
        run: |
          $e2eDir = Join-Path $env:RUNNER_TEMP "LauraE2E"
          New-Item -ItemType Directory -Path $e2eDir -Force | Out-Null
          Copy-Item -Path $env:GITHUB_WORKSPACE -Destination (Join-Path $e2eDir "code") -Recurse -Force
          & (Join-Path $env:GITHUB_WORKSPACE "installer\install.ps1") -InstallDir $e2eDir -SkipClone -NoSchedule -NoShortcut -NoMigrate
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 falhou (exit $LASTEXITCODE)" }
      - name: Validar estrutura instalada
        shell: pwsh
        run: |
          $codeDir = Join-Path $env:RUNNER_TEMP "LauraE2E\code"
          if (-not (Test-Path (Join-Path $codeDir ".venv\Scripts\python.exe"))) { throw "venv nao criado" }
          if (-not (Test-Path (Join-Path $codeDir ".env"))) { throw ".env nao criado a partir do .env.example" }
          if (-not (Test-Path (Join-Path $codeDir "tools\cloudflared.exe"))) { throw "cloudflared nao baixado" }
          Write-Host "Estrutura instalada OK (venv, .env, cloudflared)"
      - name: Health check do webhook
        shell: pwsh
        run: |
          $deadline = (Get-Date).AddMinutes(3)
          $ok = $false
          while ((Get-Date) -lt $deadline) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:8766/health" -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { Start-Sleep -Seconds 5 }
          }
          if (-not $ok) {
            Get-Content (Join-Path $env:RUNNER_TEMP "LauraE2E\code\logs\laura-services.log") -ErrorAction SilentlyContinue
            throw "webhook /health nao respondeu em 3 minutos"
          }
          Write-Host "Webhook saudavel: $($r.Content)"
      - name: Cleanup servicos
        if: always()
        shell: pwsh
        env:
          LAURA_HOME: ${{ runner.temp }}\LauraE2E\code
        run: |
          & (Join-Path $env:LAURA_HOME "scripts\laura-services.ps1") stop
          if (Test-Path $env:LAURA_HOME) { Remove-Item -Recurse -Force $env:LAURA_HOME }

  e2e-real:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir --no-binary annoy -e ".[dev]"
      - name: Smoke test real contra a Shopee (opt-in via secrets)
        run: python -m pytest tests/integration/test_e2e_shopee_real.py -m integration -q --tb=short -rs
        env:
          LAURA_E2E_REAL: ${{ secrets.LAURA_E2E_REAL }}
          SHOPEE_PARTNER_ID: ${{ secrets.SHOPEE_PARTNER_ID }}
          SHOPEE_PARTNER_KEY: ${{ secrets.SHOPEE_PARTNER_KEY }}
          SHOPEE_REDIRECT_URL: ${{ secrets.SHOPEE_REDIRECT_URL }}
          SHOPEE_DEFAULT_SHOP_ID: ${{ secrets.SHOPEE_DEFAULT_SHOP_ID }}
          SHOPEE_DEFAULT_ACCESS_TOKEN: ${{ secrets.SHOPEE_DEFAULT_ACCESS_TOKEN }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 30
    needs: [test, mypy, integration, pester, build-setup, install-e2e, e2e-real]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Download Setup.exe
        uses: actions/download-artifact@v6
        with:
          name: laura-setup
          path: dist
      - name: Gerar checksums SHA256
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h *$($_.Name)" | Out-File -FilePath dist\SHA256SUMS.txt -Append -Encoding ascii
          }
          Get-Content dist\SHA256SUMS.txt
      - name: Publicar Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $notes = "Laura $env:GITHUB_REF_NAME - instalador Windows com painel de controle e atualizacao automatica.`n`nVerifique o checksum em SHA256SUMS.txt."
          gh release create $env:GITHUB_REF_NAME dist\Laura-Setup-*.exe dist\SHA256SUMS.txt --title "Laura $env:GITHUB_REF_NAME" --notes $notes
