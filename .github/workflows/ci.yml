name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pytest-xdist pytest-cov mypy types-requests types-PyYAML types-setuptools

      - name: Lint with ruff
        run: ruff check shopee_agent/ --line-length=120

      - name: Test with pytest
        run: python -m pytest tests/ -q --tb=short --ignore=tests/_archive -k "not test_memory_summary_command" --junitxml=junit.xml -o junit_family=legacy --cov=shopee_agent --cov-report=xml --cov-report=term-missing --cov-fail-under=30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: junit.xml

      - name: Upload coverage to summary
        if: always()
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          badge: true
          format: markdown
          output: both

  mypy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" mypy types-requests types-PyYAML types-setuptools

      - name: Run mypy
        run: mypy shopee_agent/paths.py shopee_agent/config.py shopee_agent/logger.py shopee_agent/retry.py shopee_agent/rate_limit.py shopee_agent/structured_logger.py shopee_agent/tracing.py shopee_agent/event_bus.py shopee_agent/api_cache.py shopee_agent/auth.py shopee_agent/graceful_shutdown.py shopee_agent/plugin_sdk.py shopee_agent/api_router.py --ignore-missing-imports --follow-imports=skip --no-error-summary
